{% extends 'Base/base_admin.html' %}

{% block title %}Supprimer une catégorie — Délice Express{% endblock %}
{% block page_title %}Confirmer la suppression{% endblock %}

{% block content %}

    <form method="post" class="card-form">
        {% csrf_token %}
        <p>Confirmer la suppression de "<strong>{{ object }}</strong>" ?</p>
        <div class="btn-bar">
            <button type="submit" class="btn danger">Oui, supprimer</button>
            <a href="{% url 'menu_categories' %}" class="btn secondary">Annuler</a>
        </div>
    </form>

{% endblock %}
