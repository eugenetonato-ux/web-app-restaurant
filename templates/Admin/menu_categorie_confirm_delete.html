{% extends 'Base/base_admin.html' %}
{% load static %}

{% block title %}Supprimer une catégorie — Délice Express Admin{% endblock %}

{% block content %}
<div class="form-card-admin form-card-admin--narrow">
    <h2 style="color: #E8445C;">Confirmer la suppression</h2>
    <p style="margin-bottom: 1.5rem;">
        Voulez-vous vraiment supprimer la catégorie "<strong>{{ object.nom }}</strong>" ?
    </p>

    <form method="POST">
        {% csrf_token %}
        <div class="form-actions-row-admin">
            <button type="submit" class="btn-checkout-pos danger">
                Oui, Supprimer
            </button>
            <a href="{% url 'menu_categories' %}" class="btn-cancel-admin">
                Annuler
            </a>
        </div>
    </form>
</div>
{% endblock %}
