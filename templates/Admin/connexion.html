<!-- templates/Admin/connexion.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Délice Express</title>
    <style>
        :root {
            --primary: #6C3CE9;
            --primary-light: #F3EEFE;
            --bg: #F7F7FB;
            --danger: #E8445C;
            --text: #1E1E2D;
            --text-secondary: #8A8A9E;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .login-card h1 {
            font-size: 20px;
            margin-bottom: 24px;
            text-align: center;
        }
        .login-card input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #E0E0EA;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 14px;
        }
        .login-card button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .login-card button:hover { opacity: 0.9; }
        .messages p {
            background: var(--primary-light);
            color: var(--primary);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Délice Express — Connexion</h1>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}<p>{{ message }}</p>{% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Nom d'utilisateur">
            <input type="password" name="password" placeholder="Mot de passe">
            <button type="submit">Se connecter</button>
        </form>
    </div>

</body>
</html>
