<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Délice Express Back-Office</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #6C3CE9 0%, #2D1B69 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            background: #FFFFFF;
            border-radius: 28px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            text-align: center;
        }
        .login-card h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1E1E2D;
            margin: 0.5rem 0 1.5rem 0;
        }
        .form-group {
            text-align: left;
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            color: #4B5563;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 14px;
            border: 1px solid #E5E7EB;
            font-family: inherit;
            box-sizing: border-box;
            font-size: 0.95rem;
            outline: none;
        }
        .form-group input:focus {
            border-color: #6C3CE9;
        }
        .password-input-wrapper {
            position: relative;
        }
        .password-input-wrapper input {
            padding-right: 2.8rem;
        }
        .toggle-password-visibility {
            position: absolute;
            top: 50%;
            right: 0.6rem;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #8A8A9E;
            cursor: pointer;
            font-size: 1rem;
            padding: 0.4rem 0.6rem;
            line-height: 1;
        }
        .toggle-password-visibility:hover {
            color: #6C3CE9;
        }
        .btn-submit {
            background: #6C3CE9;
            color: white;
            border: none;
            width: 100%;
            padding: 0.9rem;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(108, 60, 233, 0.4);
            margin-top: 1rem;
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem;
                box-sizing: border-box;
            }
            .login-card {
                padding: 2rem 1.5rem;
                border-radius: 22px;
            }
            .login-card h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <i class="fa-solid fa-utensils" style="font-size: 3rem; color: #6C3CE9;"></i>
        <h1>Back-Office Staff</h1>

        {% if messages %}
            {% for message in messages %}
                <div style="padding: 0.7rem; border-radius: 10px; background: #FDE8EA; color: #E8445C; font-weight: 600; font-size: 0.85rem; margin-bottom: 1rem;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Nom d'utilisateur :</label>
                <input type="text" name="username" required placeholder="Identifiant personnel">
            </div>

            <div class="form-group">
                <label>Mot de passe :</label>
                <div class="password-input-wrapper">
                    <input type="password" name="password" id="passwordField" required placeholder="••••••••">
                    <button type="button" class="toggle-password-visibility" id="togglePasswordBtn" aria-label="Afficher le mot de passe" aria-pressed="false" tabindex="-1">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                Se connecter <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
        
        <p style="margin-top: 1.5rem; font-size: 0.8rem; color: #8A8A9E;">
            <a href="{% url 'website_home' %}" style="color: #6C3CE9; text-decoration: none;">← Retour au site public</a>
        </p>
    </div>

    <script>
        var toggleBtn = document.getElementById('togglePasswordBtn');
        var pwdField = document.getElementById('passwordField');
        if (toggleBtn && pwdField) {
            toggleBtn.addEventListener('click', function () {
                var isHidden = pwdField.type === 'password';
                pwdField.type = isHidden ? 'text' : 'password';
                toggleBtn.setAttribute('aria-pressed', isHidden ? 'true' : 'false');
                toggleBtn.setAttribute('aria-label', isHidden ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
                toggleBtn.innerHTML = isHidden
                    ? '<i class="fa-solid fa-eye-slash"></i>'
                    : '<i class="fa-solid fa-eye"></i>';
            });
        }
    </script>
</body>
</html>
